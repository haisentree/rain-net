name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./pkg ./protocol ./test)
          if [ -n "$unformatted" ]; then
            echo "需要 gofmt: $unformatted"
            exit 1
          fi
