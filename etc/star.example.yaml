# rain-net 新 schema 示例(design.md §三)
# 协议 × 传输正交:ingress 声明接入点(transport 可换 tcp/tls/ws/h2/quic),
# handlers 声明协议插件链,dialers 声明出站,routes 按声明顺序首中即停。
#
# 旧 schema(listenerList/dailerList/handlerList)已废弃:启动时检测到即报错并给出迁移对照。

service:
  - name: test-1
    ingress:
      # 反向代理数据面入口:空 handler = 连接泵代理,由 routes 驱动
      - name: proxy-in
        transport: tcp
        addr: 0.0.0.0:8085

      # 隧道服务端(ctrl 控制通道):handler star
      - name: star-in
        transport: tls
        addr: 0.0.0.0:5172
        handler: star
        settings:
          credentials:                # 客户端凭据表:keyPassword 即接入凭据
            - name: clientProxy-0
              keyPassword: pwd-client-0
              streams: [dailer-0-stream-1, dailer-0-stream-2]
            - name: clientProxy-1
              keyPassword: pwd-client-1
              streams: [dailer-1-stream-1]

      # 管理面:admin API + 内嵌 Web 管理台
      - name: admin-in
        transport: tcp
        addr: 127.0.0.1:5173
        handler: admin
        settings:
          adminPassword: admin-secret # 未配置时接口拒绝一切请求

      # 正向代理示例(插件链):httpProxy + socks5
      - name: forward-in
        transport: tcp
        addr: 0.0.0.0:5170
        handler: proxy-chain

handlers:
  - name: proxy-chain
    plugins: [httpProxy, socks5]

dialers:
  # 隧道出站:rainc 以 -name 领取一个 dialer 定义运行
  - name: office-0
    type: star
    transport: tls
    addr: 127.0.0.1:5172
    identity: clientProxy-0
    keyPassword: pwd-client-0
    locals:                           # stream → 本地内网服务
      - stream: dailer-0-stream-1
        addr: 127.0.0.1:9991
      - stream: dailer-0-stream-2
        addr: 127.0.0.1:9992

  - name: office-1
    type: star
    transport: tls
    addr: 127.0.0.1:5172
    identity: clientProxy-1
    keyPassword: pwd-client-1
    locals:
      - stream: dailer-1-stream-1
        addr: 127.0.0.1:9993

routes:                               # 声明顺序即优先级,首中即停;多条 streams 间 round-robin
  - ingress: proxy-in
    to: office-0
    streams: [dailer-0-stream-1]
  - ingress: proxy-in
    to: office-1
    streams: [dailer-1-stream-1]
